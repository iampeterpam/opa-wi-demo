# .github/workflows/opa-workflow.yml
# OPA WORKLOAD IDENTITY APPROACH — THIS IS THE LIVE DEMO WORKFLOW
# Push to main branch. Trigger this during Act 2.
# Zero stored credentials. GitHub OIDC JWT → OPA token → ephemeral SSH cert.

name: Deploy (OPA Workload Identity)

on:
  workflow_dispatch:
    inputs:
      customer_name:
        description: 'Customer name to display on dashboard'
        required: true
        default: 'peter_farley'

permissions:
  id-token: write   # Required: allows GitHub to issue OIDC JWT to this job
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Step 1: Install sft CLI ──────────────────────────────────────────
      - name: Install OPA sft CLI
        run: |
          curl -fsSL https://dist.scaleft.com/GPG-KEY-OktaPAM-2023 | \
            gpg --dearmor | sudo tee /usr/share/keyrings/oktapam-2023-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oktapam-2023-archive-keyring.gpg] https://dist.scaleft.com/repos/deb jammy okta" | \
            sudo tee /etc/apt/sources.list.d/oktapam-stable.list
          sudo apt-get update -y
          sudo apt-get install -y scaleft-client-tools
          sft --version

      # ── Step 2: Configure OPA gateway ───────────────────────────────────
      - name: Configure sft
        run: |
          # OPA_ADDR is the documented env var for the gateway URL (sft.conf key is unknown)
          echo "OPA_ADDR=https://pfarley.pam.oktapreview.com" >> $GITHUB_ENV
          echo "SFT_TEAM=farley" >> $GITHUB_ENV

          # Probe sft binary for API endpoint paths and config key names
          echo "=== sft API paths (workload/token/authenticate) ==="
          strings $(which sft) | grep -E '/(v[0-9]|workload|token|authenticate|opa)' | sort -u | head -30 || true
          echo "=== sft config keys ==="
          strings $(which sft) | grep -iE '^[a-z][a-z_]{2,20}$' | sort -u | grep -iE '(url|addr|server|host|gateway|team|address)' | head -20 || true

      # ── Step 3: Request GitHub OIDC JWT ─────────────────────────────────
      - name: Request GitHub OIDC Token
        id: oidc
        run: |
          echo "Requesting OIDC token from GitHub..."
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=github-actions-prod" | jq -r '.value')

          # Decode header BEFORE masking — shows kid and alg
          echo "=== JWT Header (kid / alg) ==="
          HEADER=$(echo "$OIDC_TOKEN" | cut -d. -f1)
          MOD=$((${#HEADER} % 4))
          [ $MOD -ne 0 ] && HEADER="${HEADER}$(printf '=%.0s' $(seq 1 $((4 - MOD))))"
          echo "$HEADER" | base64 -d 2>/dev/null | jq '.' || true

          # Decode payload claims
          echo "=== JWT Claims ==="
          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d. -f2)
          MOD=$((${#PAYLOAD} % 4))
          [ $MOD -ne 0 ] && PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $((4 - MOD))))"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '.' || true

          # Check GitHub OIDC JWKS key IDs — must include the kid from JWT header above
          echo "=== GitHub OIDC JWKS key IDs ==="
          curl -s https://token.actions.githubusercontent.com/.well-known/jwks | \
            jq '.keys[] | {kid: .kid, alg: .alg, kty: .kty}' || true

          echo "::add-mask::$OIDC_TOKEN"
          echo "token=$OIDC_TOKEN" >> $GITHUB_OUTPUT
          echo "✅ OIDC token received (masked)"

      # ── Step 4: Authenticate with OPA Workload Identity ─────────────────
      - name: Authenticate with OPA Workload Identity
        id: opa-auth
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          # Direct curl with verbose headers — look for trace/request IDs in response
          echo "=== Direct curl (verbose headers) to OPA issue_token ==="
          curl -si -w "\nHTTP: %{http_code}" \
            -X POST "https://pfarley.pam.oktapreview.com/v1/teams/farley/workloads/github-actions-prod/issue_token" \
            -H "Content-Type: application/json" \
            -d "{\"credential_type\":\"jwt\",\"jwt\":\"${GITHUB_OIDC_TOKEN}\"}" 2>&1 | grep -v "^Authorization:" || true
          echo ""

          # Try OIDC token as Bearer against connections list — see if workload token grants read access
          echo "=== GET /v1/teams/farley/connections/workloads (OIDC as Bearer) ==="
          curl -s -w "\nHTTP: %{http_code}" \
            -H "Authorization: Bearer ${GITHUB_OIDC_TOKEN}" \
            "https://pfarley.pam.oktapreview.com/v1/teams/farley/connections/workloads" || true
          echo ""

          echo "=== sft workload authenticate ==="
          SFT_DEBUG=1 sft workload authenticate \
            --team farley \
            --connection github-actions-prod \
            --jwt-env GITHUB_OIDC_TOKEN > /tmp/sft_out.txt 2>/tmp/sft_debug.txt || true
          echo "--- stdout ---"
          cat /tmp/sft_out.txt
          echo "--- stderr/debug ---"
          cat /tmp/sft_debug.txt
          echo "--- exit: done ---"

          OPA_TOKEN=$(cat /tmp/sft_out.txt | tr -d '\n\r')
          echo "::add-mask::$OPA_TOKEN"
          echo "OPA_TOKEN=$OPA_TOKEN" >> $GITHUB_ENV
          echo "✅ OPA token issued (TTL: 300s)"

      # ── Step 5: SSH into target and update state.json ────────────────────
      - name: Update dashboard via brokered SSH
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          START_TS=$(date +%s)

          echo "Opening brokered SSH session to target-server-01..."

          # Build payload locally and base64-encode to avoid quoting issues across the SSH boundary
          PAYLOAD_B64=$(cat <<JSON | base64 -w0
          {
            "customer": "${{ github.event.inputs.customer_name }}",
            "status": "success",
            "last_deploy": "${TIMESTAMP}",
            "deployed_by": "wl_github_actions (OPA Workload Identity)",
            "session_duration_seconds": null,
            "standing_credentials_used": 0,
            "deployment_count": 1,
            "opa_connection": "github-actions-prod",
            "git_repo": "${{ github.repository }}",
            "git_branch": "${{ github.ref_name }}",
            "git_commit": "${{ github.sha }}"
          }
          JSON
          )

          sft ssh --team farley target-server-01 <<SSHEOF
          echo "${PAYLOAD_B64}" | base64 -d | sudo tee /var/www/demo-app/state.json > /dev/null
          echo 'state.json updated'
          SSHEOF

          END_TS=$(date +%s)
          DURATION=$((END_TS - START_TS))
          echo "SSH_DURATION=${DURATION}" >> $GITHUB_ENV
          echo "✅ SSH session closed. Duration: ${DURATION}s. Certificate expired."
          echo "✅ JIT account (wl_github_actions) torn down by OPA."

      # ── Step 6: Patch session_duration back into state.json ─────────────
      - name: Update session duration
        run: |
          DUR=${SSH_DURATION:-0}

          sft ssh --team farley target-server-01 <<SSHEOF || echo "Duration patch skipped (token may have expired — that's fine)"
          CURRENT=\$(cat /var/www/demo-app/state.json)
          printf '%s\n' "\$CURRENT" | jq --argjson dur ${DUR} '.session_duration_seconds = \$dur' | sudo tee /var/www/demo-app/state.json > /dev/null
          SSHEOF

      # ── Summary ─────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## OPA Workload Identity — Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Customer | ${{ github.event.inputs.customer_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OPA Connection | github-actions-prod |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Standing Credentials | **0** |" >> $GITHUB_STEP_SUMMARY
          echo "| JWT Source | GitHub OIDC |" >> $GITHUB_STEP_SUMMARY
